# ═══════════════════════════════════════════════════════════════
# ONNX Screen Capture + X CLOUD AI AIMBOT - CONFIG DEFINITIVA
# ═══════════════════════════════════════════════════════════════

[general]
enabled = @TOGGLE:true
debug_mode = @TOGGLE:false
auto_start = @TOGGLE:false
language = @DROPDOWN(es|en|pt|fr|de):es

[detection]
confidence_threshold = @SLIDER_FLOAT(0,1,0.01):0.25
nms_threshold = @SLIDER_FLOAT(0,1,0.01):0.45
max_detections = @SLIDER_INT(1,500,1):100

[regions]
roi_enabled = @TOGGLE:false
roi_x = @SLIDER_INT(0,3840,1):0
roi_y = @SLIDER_INT(0,2160,1):0
roi_width = @SLIDER_INT(100,3840,1):1920
roi_height = @SLIDER_INT(100,2160,1):1080

[filters]
min_width = @SLIDER_FLOAT(0,500,1):10
min_height = @SLIDER_FLOAT(0,500,1):10
max_width = @SLIDER_FLOAT(100,3840,1):1920
max_height = @SLIDER_FLOAT(100,2160,1):1080
min_area = @SLIDER_FLOAT(0,100000,100):100
max_area = @SLIDER_FLOAT(1000,10000000,1000):2073600

[actions]
action_enabled = @TOGGLE:true
action_mode = @DROPDOWN(single|all|batch):single
default_action = @DROPDOWN(tap|double_tap|long_press|swipe|none):tap
action_delay_ms = @SLIDER_INT(0,2000,10):100
tap_duration_ms = @SLIDER_INT(10,500,5):50
swipe_duration_ms = @SLIDER_INT(50,1000,10):300
long_press_duration_ms = @SLIDER_INT(100,2000,50):500
swipe_distance = @SLIDER_INT(50,1000,10):200

[targeting]
target_mode = @DROPDOWN(center|top_left|top_right|bottom_left|bottom_right|random):center
offset_x = @SLIDER_INT(-500,500,1):0
offset_y = @SLIDER_INT(-500,500,1):0
priority_mode = @DROPDOWN(highest_confidence|lowest_confidence|largest_area|smallest_area|closest_to_center|first_detected|by_class):highest_confidence
priority_class = @SLIDER_INT(-1,100,1):-1

[overlay]
show_boxes = @TOGGLE:true
show_labels = @TOGGLE:true
show_confidence = @TOGGLE:true
box_color = @COLOR:#FF0000
label_size = @SLIDER_INT(8,32,1):14
box_thickness = @SLIDER_FLOAT(1,10,0.5):2

[performance]
frame_skip = @SLIDER_INT(0,10,1):0
processing_threads = @SLIDER_INT(1,8,1):4
use_gpu = @TOGGLE:true
use_nnapi = @TOGGLE:true

[logging]
log_detections = @TOGGLE:false
log_actions = @TOGGLE:false
log_performance = @TOGGLE:false

# ═══════════════════════════════════════════════════════════════
# X CLOUD AI AIMBOT - 100% MAPEADO DEL JS ORIGINAL
# ═══════════════════════════════════════════════════════════════
[xcloud_aim]
# === GENERAL ===
enable = @TOGGLE:true
# Rutas comunes donde buscar el modelo (se usa la primera que exista):
# - /sdcard/ONNX/movenet_singlepose_lightning.onnx
# - /storage/emulated/0/ONNX/movenet_singlepose_lightning.onnx
# - /sdcard/Download/movenet_singlepose_lightning.onnx
model_path = /sdcard/ONNX/movenet_singlepose_lightning.onnx
# Si model_path está vacío, XCloudAimbot usará el modelo cargado en la app principal
use_main_model = @TOGGLE:true

# === CONTROL PRINCIPAL ===
# always_on_enabled: Si es true, el aimbot siempre está activo sin necesidad de presionar un botón
always_on_enabled = @TOGGLE:true

# === DETECCIÓN (del JS: detection) ===
detection_enabled = @TOGGLE:true
better_detection = @TOGGLE:true
model_type = @DROPDOWN(SINGLEPOSE_LIGHTNING|SINGLEPOSE_THUNDER):SINGLEPOSE_LIGHTNING
enable_smoothing = @TOGGLE:true
min_pose_score = @SLIDER_FLOAT(0.1,0.9,0.01):0.40
keypoint_confidence = @SLIDER_FLOAT(0.1,0.9,0.01):0.35
min_valid_keypoints = @SLIDER_INT(5,17,1):10
max_detections = @SLIDER_INT(1,10,1):5
processing_interval_ms = @SLIDER_INT(1,100,1):5
skip_frames = @SLIDER_INT(0,10,1):2

# === IGNORE SELF REGION (del JS: ignoreSelfRegion) ===
ignore_self_region_enabled = @TOGGLE:true
ignore_self_x_percent = @SLIDER_FLOAT(0.0,1.0,0.01):0.00
ignore_self_y_percent = @SLIDER_FLOAT(0.0,1.0,0.01):0.27
ignore_self_width_percent = @SLIDER_FLOAT(0.0,1.0,0.01):0.43
ignore_self_height_percent = @SLIDER_FLOAT(0.0,1.0,0.01):0.74

# === GAME (del JS: game) ===
auto_shoot = @TOGGLE:false
trigger_delay_before_shoot = @SLIDER_INT(0,200,1):10
burst_mode = @TOGGLE:false
burst_count = @SLIDER_INT(1,10,1):3
burst_interval = @SLIDER_INT(50,500,10):100

# === AIM (del JS: aim) ===
activation_key = @DROPDOWN(MouseRight|KeyQ|KeyE|VolumeUp|VolumeDown):MouseRight
activation_button = @DROPDOWN(A|B|X|Y|LB|RB|LT|RT):A
toggle_mode = @TOGGLE:false
fov_radius = @SLIDER_INT(50,800,10):136
aim_point = @DROPDOWN(nose|left_eye|right_eye|left_ear|right_ear|left_shoulder|right_shoulder|left_elbow|right_elbow|left_wrist|right_wrist|left_hip|right_hip|left_knee|right_knee|left_ankle|right_ankle):nose
head_offset = @SLIDER_FLOAT(-0.5,0.5,0.01):0.15
body_offset = @SLIDER_FLOAT(0.0,1.0,0.01):0.40
target_priority = @DROPDOWN(center|mouse_position):center
target_switch_cooldown_ms = @SLIDER_INT(0,500,10):0
trigger_threshold = @SLIDER_FLOAT(0.1,1.0,0.05):0.70

# === AIM SPEED (del JS: aimSpeed) ===
aim_speed_enabled = @TOGGLE:true
aim_speed_percent = @SLIDER_FLOAT(10.0,100.0,1.0):45.0

# === SMART SLOWDOWN (del JS: smartSlowdown) ===
smart_slowdown_enabled = @TOGGLE:true
smart_slowdown_max_speed = @SLIDER_FLOAT(50.0,300.0,5.0):100.0
smart_slowdown_min_speed = @SLIDER_FLOAT(10.0,100.0,5.0):30.0
slowdown_radius = @SLIDER_INT(50,300,10):90
nonlinear_enabled = @TOGGLE:true
nonlinear_exponent = @SLIDER_FLOAT(1.0,3.0,0.1):1.5
prediction_in_slowdown = @TOGGLE:true
velocity_boost_factor = @SLIDER_FLOAT(0.1,2.0,0.1):0.5
fps_compensation = @TOGGLE:true
min_fps_threshold = @SLIDER_INT(20,60,1):30

# === PREDICCIÓN (del JS: prediction) ===
prediction_enabled = @TOGGLE:true
latency_compensation = @SLIDER_INT(0,300,5):75
jitter_buffer_size = @SLIDER_INT(1,10,1):5
max_velocity = @SLIDER_INT(500,2000,50):1000
smoothing_factor = @SLIDER_FLOAT(0.05,0.5,0.01):0.20
prediction_scale = @SLIDER_FLOAT(0.5,3.0,0.1):1.10

# === CONTROLLER (del JS: controller) ===
controller_enabled = @TOGGLE:false
use_virtual_gamepad = @TOGGLE:false
dead_zone = @SLIDER_FLOAT(0.0,1.0,0.01):0.20
sensitivity_x = @SLIDER_FLOAT(0.5,5.0,0.1):2.0
sensitivity_y = @SLIDER_FLOAT(0.5,5.0,0.1):2.0
shoot_button = @DROPDOWN(A|B|X|Y|LB|RB|LT|RT|Back|Start):RT
aim_button = @DROPDOWN(A|B|X|Y|LB|RB|LT|RT|Back|Start):LT

# === VISUALES (del JS: visual) ===
show_debug_info = @TOGGLE:true
# esp_show_only_when_aiming: Si es false, los overlays (skeleton, bboxes) se muestran SIEMPRE
esp_show_only_when_aiming = @TOGGLE:false

# CROSSHAIR
crosshair_enabled = @TOGGLE:true
crosshair_style = @DROPDOWN(dot|cross|circle):dot
crosshair_color = @COLOR:#000000
crosshair_size = @SLIDER_INT(1,10,1):3
crosshair_center_on_game = @TOGGLE:true

# TARGET LOCK
target_lock_enabled = @TOGGLE:false
target_lock_style = @DROPDOWN(full|corners):full
target_lock_color = @COLOR:#FF0000
target_lock_line_width = @SLIDER_INT(1,5,1):2
target_lock_fill_enabled = @TOGGLE:true
target_lock_fill_color = @COLOR:rgba(255,0,0,0.2)
target_lock_gradient_enabled = @TOGGLE:true
target_lock_gradient_speed = @SLIDER_FLOAT(0.1,1.0,0.1):0.5

# SKELETON
skeleton_enabled = @TOGGLE:true
skeleton_color = @COLOR:#FFFFFF
skeleton_line_width = @SLIDER_INT(1,5,1):2
skeleton_gradient_enabled = @TOGGLE:true
skeleton_gradient_speed = @SLIDER_FLOAT(0.1,1.0,0.1):0.5

# HEAD DOT
head_dot_enabled = @TOGGLE:true
head_dot_color = @COLOR:#00FFFF
head_dot_size = @SLIDER_INT(1,10,1):4

# AIM POINT
aim_point_enabled = @TOGGLE:false
aim_point_style = @DROPDOWN(cross|dot):cross
aim_point_color = @COLOR:rgba(255,255,0,0.9)
aim_point_size = @SLIDER_INT(1,20,1):8
aim_point_line_width = @SLIDER_INT(1,5,1):1

# TRACERS
tracers_enabled = @TOGGLE:true
tracers_color = @COLOR:rgba(255,255,255,0.9)
tracers_line_width = @SLIDER_INT(1,5,1):1

# FOV CIRCLE
fov_circle_enabled = @TOGGLE:true
fov_circle_color = @COLOR:rgba(255,255,255,0.3)
fov_circle_line_width = @SLIDER_INT(1,5,1):1
fov_circle_center_on_game = @TOGGLE:true
fov_circle_show_only_when_aiming = @TOGGLE:true
fov_circle_gradient_enabled = @TOGGLE:false
fov_circle_gradient_speed = @SLIDER_FLOAT(0.1,1.0,0.1):0.5

# PERFORMANCE METRICS
performance_metrics_enabled = @TOGGLE:true
performance_metrics_position = @DROPDOWN(top-left|top-right|bottom-left|bottom-right):top-left

# IGNORE REGION VISUAL
draw_ignore_region_enabled = @TOGGLE:false
draw_ignore_region_color = @COLOR:rgba(50,50,50,0.4)
draw_ignore_region_line_width = @SLIDER_INT(1,5,1):1
draw_ignore_region_show_only_when_aiming = @TOGGLE:true

# ═══════════════════════════════════════════════════════════════
# LOW-LATENCY PROCESSING - NDK/NATIVE OPTIMIZATION
# ═══════════════════════════════════════════════════════════════
[low_latency]
# Use native (NDK/C++) preprocessing for ByteBuffer to FloatArray conversion
use_native_preprocessing = @TOGGLE:true

# Use NNAPI hardware acceleration for ONNX inference (requires compatible SoC)
use_nnapi = @TOGGLE:true

# Use relative movement via ActionEngine.moveRelative() instead of absolute swipe
use_relative_movement = @TOGGLE:true

# Minimum swipe duration in milliseconds (lower = faster but may not register)
min_swipe_duration_ms = @SLIDER_INT(1,50,1):1

# Enable background thread for action execution (non-blocking shell commands)
use_background_action_thread = @TOGGLE:true

# Enable delta-time based smoothing (FPS-independent movement)
use_delta_time_smoothing = @TOGGLE:true

# Root mode required for moveRelative() - will auto-detect if available
require_root_mode = @TOGGLE:true

# Log NDK preprocessing timing every N frames (0 = disabled)
ndk_timing_log_interval = @SLIDER_INT(0,120,1):60

# Maximum preprocessing time in microseconds before logging warning
max_preprocessing_time_us = @SLIDER_INT(100,5000,100):1000
